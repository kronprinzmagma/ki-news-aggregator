name: Tests

# Führt bei jedem Push/PR ESLint (js/recommended, blockierend) und die
# node:test-Suite mit Abdeckungsbericht aus (Katalog C5/C9).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint js/recommended)
        run: npm run lint

      - name: Run tests with coverage
        run: npm run test:coverage
