# Statische Sicherheitspruefung mit Semgrep OSS (Entscheid Nils 2026-11-17).
# Laeuft vollstaendig im Runner: kein Semgrep-Konto, keine Metriken, kein Code
# verlaesst GitHub; nur die Regelpakete werden aus der Semgrep-Registry geladen.
# Vorerst nur Warnung: Funde erscheinen im Log, der Job bleibt gruen. Blockieren
# (Flag --error) erst, wenn die Funde einige Wochen gesichtet sind.
name: Semgrep

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Python 3.14 statt 3.15: semgrep 1.186.0 liefert Wheels nur bis cp314; unter 3.15
      # bricht semgrep-core in der CI ab (exit -11, 2026-11-20). Anheben, sobald ein
      # Release cp315-Wheels hat.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - name: Semgrep installieren
        run: pip install semgrep==1.185.0
      - name: Semgrep (nur Warnung)
        run: semgrep scan --config p/javascript --config p/typescript --metrics=off
