name: Prompt-Injection-Eval

# Nur manuell (Kosten): prueft Scoring- und Aufbereitungs-Prompt mit festen
# Injection-Faellen aus evals/redteam/. Kein Lauf bei Push oder PR.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  injection:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # Kein Artikeltext und kein Prompt geht an promptfoo-Server.
      PROMPTFOO_DISABLE_REMOTE_GENERATION: 'true'
      PROMPTFOO_DISABLE_TELEMETRY: '1'
      PROMPTFOO_DISABLE_UPDATE: '1'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Run Injection-Eval
        run: npm run eval:injection

      - name: Upload Results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: injection-results-${{ github.sha }}
          path: evals/results/injection-latest.json
          retention-days: 90
