name: Weekly KI-Digest

on:
  schedule:
    # Sonntags 08:00 UTC = 10:00 CEST (Sommer) / 09:00 CET (Winter)
    # Läuft nach dem Daily (05:30 UTC), damit der Sonntags-Daily bereits vorliegt
    - cron: '0 8 * * 0'
  workflow_dispatch:

concurrency:
  group: weekly-digest
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GH_PAT: ${{ secrets.GH_PAT }}
      # Optional: ohne diesen Secret wird die Weekly-Audio-Ausgabe übersprungen.
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Set run date
        run: echo "RUN_DATE=$(date -u +%Y-%m-%d)" >> $GITHUB_ENV

      - name: Weekly Digest
        run: node weekly.js
