name: Close Old Issues

on:
  schedule:
    # täglich 07:30 UTC – nach dem Daily-Run
    - cron: '30 7 * * *'
  workflow_dispatch:

jobs:
  close-old-issues:
    runs-on: ubuntu-latest
    # Schreibt nur mit GH_PAT; das Workflow-Token braucht nur Lesen fuer den Checkout.
    permissions:
      contents: read
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      # Dailies (Label summary) nach 7 Tagen schliessen, von den Wochenrueckblicken
      # (Label weekly-digest) die letzten 14 offen lassen. Warnungen und andere Issues
      # bleiben unberuehrt. Logik und Tests: scripts/close-old-issues.js,
      # test/issue-retention.test.js (nachgebaut aus gesichert/2026-10-08).
      - name: Alte Briefings archivieren (Inhalt unveraendert)
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: node scripts/close-old-issues.js
