name: Close Old Issues

on:
  schedule:
    # täglich 07:30 UTC – nach dem Daily-Run
    - cron: '30 7 * * *'
  workflow_dispatch:

jobs:
  close-old-issues:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Archive old briefings without changing their content
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: node scripts/close-old-issues.js
