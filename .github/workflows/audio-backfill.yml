name: Audio Backfill

# Erzeugt manuell die Audio-Hörfassung eines bestehenden Daily-Issues und lädt
# sie als Release-Asset hoch. Nützlich zum Nachvertonen oder Testen, ohne einen
# kompletten Daily-Lauf (ingest → score → deliver) anzustossen.

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Daily-Datum (YYYY-MM-DD) – leer = letztes Daily-Issue'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GH_PAT: ${{ secrets.GH_PAT }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Generate audio
        # Input via env statt direkter ${{ }}-Interpolation (Injection-Härtung).
        env:
          DATE_INPUT: ${{ github.event.inputs.date }}
        run: node scripts/generate-audio.js "$DATE_INPUT"

      - name: Upload local MP3 artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: audio-${{ github.event.inputs.date || 'latest' }}
          retention-days: 14
          if-no-files-found: ignore
          path: audio-*.mp3
